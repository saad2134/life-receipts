name: CI - Code Quality, Security & Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Type Check, Test & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Security (0 Vulnerabilities)
        run: npm audit --audit-level=high

      - name: TypeScript Strict Type Check
        run: npm run type-check

      - name: Run Vitest Suite (100% Passing)
        run: npm test

      - name: Production Bundle Build
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -f dist/index.html
          test -f dist/manifest.json
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          echo "✅ All build artifacts verified"

      - name: Report Bundle Size
        run: |
          echo "📦 Production Bundle Analysis:"
          du -sh dist/
          echo "---"
          ls -lh dist/assets/ | grep -E '\.(js|css)$'
