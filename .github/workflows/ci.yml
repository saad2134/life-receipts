name: CI - Code Quality, Security & Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Type Check, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Security (0 Vulnerabilities)
        run: npm audit --audit-level=high

      - name: TypeScript Strict Type Check
        run: npm run type-check

      - name: Run Vitest Suite (100% Passing)
        run: npm test

      - name: Production Bundle Build
        run: npm run build
